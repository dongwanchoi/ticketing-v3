openapi: 3.0.3
info:
  title: Ticketing V3 API
  version: 0.1.0
paths:
  /api/performances:
    get:
      operationId: listPerformances
      summary: Public approved performance catalog
      responses:
        '200':
          description: Approved performances only, including an empty list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Performance'
        '500':
          description: Internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Performance:
      type: object
      required: [id, title, venueName, minPriceKrw, maxPriceKrw]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        venueName:
          type: string
        minPriceKrw:
          type: integer
          minimum: 0
        maxPriceKrw:
          type: integer
          minimum: 0
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INTERNAL_ERROR
        message:
          type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
# Future authenticated endpoints require sessionCookie, server authorization and
# X-CSRF-TOKEN for mutations. They are not part of this implemented slice.
