spring.application.name=ticketing-v3
server.port=${V3_BACKEND_PORT:18080}
spring.datasource.url=${V3_DB_URL:jdbc:mysql://localhost:13306/ticketing_v3?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${V3_DB_USER:ticketing_v3}
spring.datasource.password=${V3_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${V3_COOKIE_SECURE:false}
# This public read-only slice has no authentication workflow or generated test user.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

server.servlet.session.cookie.same-site=lax

springdoc.swagger-ui.url=/api-contract.json
springdoc.swagger-ui.disable-swagger-default-url=true
